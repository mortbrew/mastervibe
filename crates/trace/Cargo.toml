[package]
name = "trace"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Terminal UI for the ./trace roguelike."
publish = false

[lib]
name = "trace"
path = "src/lib.rs"

[[bin]]
name = "trace"
path = "src/main.rs"

[dependencies]
trace-core = { path = "../trace-core" }
crossterm = "=0.28.1"
ratatui = "=0.28.1"
unicode-width = "=0.2.0"
# ratatui 0.28 pulls releases that need Rust 1.85+. Pin the last builds this
# toolchain (1.83) can compile, same as the earlier terminal UI.
instability = "=0.3.10"
unicode-segmentation = "=1.12.0"
darling = "=0.21.3"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "=1.0.128"
alsa = "=0.9.1"

[lints]
workspace = true
